name: Release

# 推 v* tag 即发 Pre-release（手机 + 手表两个 debug APK 当附件）。
# release 构建没配签名、编出来装不上，所以 pre-release 挂 debug 包（能装，
# 和之前聊天附件发的包同一路数）。正式版签名以后再配 keystore。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Gradle wrapper jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.jar.b64 ]; then
            base64 -d gradle/wrapper/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest --console=plain 2>&1 | tee test.log

      - name: Build debug APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :wear:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Surface Kotlin errors as annotations
        if: failure()
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            grep -E "^e: " "$f" | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- tail of $f ---"
            tail -20 "$f"
          done

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
